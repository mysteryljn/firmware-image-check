[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-image-check"
version = "0.1.0"
description = "Validate Intel HEX and S-record images and review changed flash erase blocks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mysteryljn"}]
dependencies = []

[project.scripts]
firmware-image-check = "firmware_image_check.cli:main"

[project.urls]
Repository = "https://github.com/mysteryljn/firmware-image-check"
Issues = "https://github.com/mysteryljn/firmware-image-check/issues"

[tool.setuptools.packages.find]
include = ["firmware_image_check*"]

[tool.setuptools.package-data]
firmware_image_check = ["fixtures/*"]
